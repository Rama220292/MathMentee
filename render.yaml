# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Staging only. Existing production services are managed through the dashboard.
projects:
  - name: MathMentee
    environments:
      - name: staging
        services:
          - type: web
            name: mathmentee-api-staging
            runtime: node
            region: singapore
            plan: 0.5c-512mb
            branch: main
            autoDeployTrigger: off
            rootDir: backend
            buildCommand: npm ci
            startCommand: npm start
            healthCheckPath: /health
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NODE_ENV
                value: production
              - key: APP_ENV
                value: staging
              - key: JWT_SECRET
                generateValue: true
              - key: MONGO_URI
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: EMAIL_USER
                sync: false
              - key: EMAIL_PASS
                sync: false
              - key: AWS_REGION
                sync: false
              - key: AWS_S3_QUESTION_ASSETS_BUCKET
                sync: false
              - key: AWS_ACCESS_KEY_ID
                sync: false
              - key: AWS_SECRET_ACCESS_KEY
                sync: false
              # Optional separate submission bucket; defaults to the question bucket.
              # Set AWS_S3_SUBMISSION_ASSETS_BUCKET directly on the API if needed.
              - key: FRONTEND_URL
                fromService:
                  name: mathmentee-web-staging
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: CORS_ORIGIN
                fromService:
                  name: mathmentee-web-staging
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
          - type: web
            name: mathmentee-web-staging
            runtime: static
            branch: main
            autoDeployTrigger: off
            rootDir: frontend
            buildCommand: npm ci --include=dev && VITE_BACK_END_SERVER_URL="${RENDER_API_URL}/api" npm run build
            staticPublishPath: dist
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: RENDER_API_URL
                fromService:
                  name: mathmentee-api-staging
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
